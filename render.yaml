services:
  - type: web
    name: hayitron-club
    runtime: static
    repo: https://github.com/elisheva5433/Hayitron-Club
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
